name: cognitive_trainer
description: "Aplikace pro kognitivní trénink"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: any
  flutter_bloc: any
  equatable: any
  flutter_tts: any
  shared_preferences: ^2.5.5
  google_fonts: any
  audioplayers: any 
  easy_localization: ^3.0.8
  easy_localization_loader: ^2.0.2
  vibration: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any
  flutter_native_splash: any

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/translations/langs.csv

# --- NASTAVENÍ IKONY APLIKACE ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0F19"
  adaptive_icon_foreground: "assets/logo.png"

# --- NASTAVENÍ ÚVODNÍ OBRAZOVKY (SPLASH SCREEN) ---
flutter_native_splash:
  color: "#0B0F19"
  image: "assets/logo.png"
  fullscreen: true
  android_12:
    image: "assets/logo.png"
    icon_background_color: "#0B0F19"
